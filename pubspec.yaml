name: license_sahayak
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  get: ^4.7.2
  get_storage: ^2.1.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.0
  device_info_plus: ^12.3.0
  google_fonts: ^8.0.2
  firebase_messaging: ^16.0.1
  firebase_core: ^4.1.0
  intl: ^0.20.2
  flutter_svg: ^2.2.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_local_notifications: ^21.0.0
  fluttertoast: ^9.0.0
  flutter_offline: ^6.0.0
  font_awesome_flutter: ^11.0.0
  permission_handler: ^12.0.1
  pin_code_fields: ^9.3.0
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - assets/

